{% extends "core/base.html" %}

{% block title %}Ask a Question{% endblock %}

{% block content %}
<h2 class="mb-4">New Question</h2>

<div class="alert alert-danger">Please fix the errors below.</div>

<form method="post">
    {% csrf_token %}
    <div class="row mb-3">
        <label for="title" class="col-sm-2 col-form-label">Title</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" id="title" name="title" maxlength="120" value="How to build a moon park?" placeholder="Short and clear, up to 120 characters.">
        </div>
    </div>

    <div class="row mb-3">
        <label for="text" class="col-sm-2 col-form-label">Text</label>
        <div class="col-sm-10">
        <textarea class="form-control is-invalid" id="text" name="text" rows="8" maxlength="5000" placeholder="Describe your problem in detail, up to 5000 characters."></textarea>
        <div class="invalid-feedback">Text of the question is required.</div>
        </div>
    </div>

    <div class="row mb-3">
        <label for="tags" class="col-sm-2 col-form-label">Tags</label>
        <div class="col-sm-10">
        <input type="text" class="form-control" id="tags" name="tags" maxlength="100" value="moon, park, puzzle" placeholder="Up to 3 tags">
        </div>
    </div>

    <div class="row">
        <div class="col-sm-10 offset-sm-2">
        <button type="submit" class="btn btn-success">Ask!</button>
        </div>
    </div>
</form>
{% endblock %}
