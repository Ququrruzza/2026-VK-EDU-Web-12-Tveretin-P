<div class="rating">
    <button type="button" class="btn btn-sm {% if item.vote == 'up' %}btn-success{% else %}btn-outline-success{% endif %}" title="Like">&#9650;</button>
    <span class="rating-count">{{ item.rating }}</span>
    <button type="button" class="btn btn-sm {% if item.vote == 'down' %}btn-danger{% else %}btn-outline-danger{% endif %}" title="Dislike">&#9660;</button>
</div>
