<div class="card mb-3{% if answer.is_correct %} border-success{% endif %}" id="answer-{{ answer.id }}">
<div class="card-body">
    <div class="d-flex gap-3">
    <div class="flex-shrink-0">
        {% include "core/avatar.html" with person=answer.author.profile %}
        {% include "questions/rating.html" with item=answer like_url="answer_like" field="answer" %}
    </div>
    <div class="flex-grow-1">
        <p class="card-text">{{ answer.text }}</p>
        <div class="d-flex flex-wrap align-items-center gap-2 small">
        <div class="form-check mb-0"{% if user.id != question.author_id %} title="Only the author of the question can choose the correct answer"{% endif %}>
            <input class="form-check-input js-correct" type="checkbox" id="correct-{{ answer.id }}" data-url="{% url 'correct_answer' %}" data-question="{{ question.id }}" data-answer="{{ answer.id }}"{% if answer.is_correct %} checked{% endif %}{% if user.id != question.author_id %} disabled{% endif %}>
            <label class="form-check-label" for="correct-{{ answer.id }}">Correct!</label>
        </div>
        <span class="text-muted ms-auto">{{ answer.created_at|date:"d.m.Y H:i" }}</span>
        </div>
    </div>
    </div>
</div>
</div>
